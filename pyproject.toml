[project]
name = "notion-drone-billing-report"
version = "0.01.01"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0,<1.0",
    "openpyxl>=3.1.0,<4.0",
    "google-cloud-storage>=2.14.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
